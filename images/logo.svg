<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#1E3A8A"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#0F766E"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
  </defs>

  <!-- === LOGO MARK: Three OS shapes converging === -->

  <!-- iOS Circle (top-right) -->
  <circle cx="52" cy="40" r="18" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" opacity="0.85"/>

  <!-- iPadOS Rounded Square (bottom-left) -->
  <rect x="22" y="56" width="28" height="28" rx="6" ry="6" fill="none" stroke="url(#blueGrad)" stroke-width="3.5" opacity="0.85"/>

  <!-- macOS Triangle (bottom-right) -->
  <polygon points="68,56 82,84 54,84" fill="none" stroke="url(#tealGrad)" stroke-width="3.5" stroke-linejoin="round" opacity="0.85"/>

  <!-- Central convergence dot (the "Fix" nexus) -->
  <circle cx="52" cy="56" r="4" fill="url(#blueGrad)"/>

  <!-- Connection lines from center to each shape -->
  <line x1="52" y1="56" x2="38" y2="70" stroke="#1E40AF" stroke-width="1.5" opacity="0.25"/>
  <line x1="52" y1="56" x2="64" y2="70" stroke="#1E40AF" stroke-width="1.5" opacity="0.25"/>
  <line x1="52" y1="56" x2="52" y2="28" stroke="#1E40AF" stroke-width="1.5" opacity="0.25"/>

  <!-- Small labels: iOS, iPadOS, macOS (tiny text) -->
  <text x="52" y="106" font-family="Inter, -apple-system, sans-serif" font-size="8" fill="#64748B" text-anchor="middle" font-weight="500" letter-spacing="1.5">iOS · iPadOS · macOS</text>

  <!-- === WORDMARK === -->
  <text x="100" y="47" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#0F172A" letter-spacing="-0.5">TriOS</text>
  <text x="100" y="77" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#1E40AF" letter-spacing="-0.5">Fix</text>

  <!-- Tagline -->
  <text x="100" y="95" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#64748B" font-weight="400" letter-spacing="0.3">Apple software troubleshooting</text>
</svg>